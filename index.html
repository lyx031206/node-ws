import os

# 定义 HTML 内容
html_content = """
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星尘的低语 - 诗歌艺术页</title>
    <style>
        :root {
            --bg-color: #05050a;
            --text-color: #e0e0e0;
            --accent-color: #d4af37; /* 琥珀金 */
            --font-main: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* 动态星空背景 */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 诗歌卡片 */
        .poem-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 4rem 3rem;
            border-radius: 2px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            text-align: center;
            animation: fadeIn 3s ease-out;
            position: relative;
        }

        .poem-card::before, .poem-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid var(--accent-color);
        }

        .poem-card::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .poem-card::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 0.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .author {
            font-size: 0.9rem;
            letter-spacing: 0.2rem;
            opacity: 0.7;
            margin-bottom: 3rem;
        }

        .content {
            font-size: 1.2rem;
            line-height: 2.5;
            letter-spacing: 0.15rem;
            font-weight: 300;
        }

        .content p {
            margin-bottom: 1rem;
            transition: all 0.5s;
        }

        .content p:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 装饰元素 */
        .divider {
            width: 50px;
            height: 1px;
            background: var(--accent-color);
            margin: 2rem auto;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <article class="poem-card">
        <h1>星尘的低语</h1>
        <div class="author">佚名</div>
        
        <div class="content">
            <p>万物于寂静中诞生</p>
            <p>又在星辉里消融</p>
            <p>我们是光影坠落的碎片</p>
            <div class="divider"></div>
            <p>在宇宙古老的掌纹里</p>
            <p>刻下一瞬的长久</p>
            <p>梦是唯一的向导</p>
            <p>去往没有时间终点的荒丘</p>
        </div>
    </article>

    <script>
        // 动态生成星星
        const starsContainer = document.getElementById('stars');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            
            const duration = Math.random() * 3 + 2 + 's';
            star.style.setProperty('--duration', duration);
            
            star.style.animationDelay = Math.random() * 5 + 's';
            
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
"""

# 将内容写入文件
with open("stardust_poem.html", "w", encoding="utf-8") as f:
    f.write(html_content)
